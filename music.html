<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Songs | One Leg Up</title>
  <link rel="icon" type="image/png" href="images/NewLogo/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{min-height:100vh;background:#080808;font-family:'Poppins',sans-serif;color:#fff;overflow-x:hidden;}
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(26,24,40,0.18),rgba(4,6,14,0.6) 60%,rgba(0,0,0,0.92) 100%),url('images/playboy-bg.png') center center/cover no-repeat;}
    #bg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,186,118,0.07),transparent 50%);}
    @keyframes goldShimmer{0%{background-position:-400% center;}100%{background-position:400% center;}}
    .gold-shimmer{background:linear-gradient(90deg,#7a5700 0%,#c8960c 12%,#f3c675 25%,#fffbe8 38%,#ffd700 50%,#fffbe8 62%,#f3c675 75%,#c8960c 88%,#7a5700 100%);background-size:400% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 5s linear infinite;}
    .page{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;}
    .topbar{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
    .back{display:inline-flex;align-items:center;gap:6px;color:rgba(243,198,117,0.7);text-decoration:none;font-size:0.82rem;letter-spacing:0.08em;transition:color .2s;}
    .back:hover{color:#f3c675;}
    .back svg{width:14px;height:14px;fill:currentColor;}
    .header{text-align:center;margin-bottom:40px;width:100%;max-width:600px;}
    .header .eyebrow{font-size:0.72rem;letter-spacing:0.42em;text-transform:uppercase;color:rgba(255,220,150,0.5);margin-bottom:8px;}
    .header h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,8vw,3rem);font-weight:900;line-height:1;}
    .header p{margin-top:14px;font-size:0.92rem;color:rgba(200,184,150,0.85);line-height:1.65;max-width:480px;margin-left:auto;margin-right:auto;}
    .track{width:100%;max-width:600px;background:rgba(10,25,35,0.78);border:1px solid rgba(243,198,117,0.18);border-radius:16px;padding:22px 24px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,0.45);margin-bottom:18px;display:flex;gap:18px;align-items:center;}
    .track-num{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:rgba(243,198,117,0.1);border:1px solid rgba(243,198,117,0.35);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:1.1rem;color:#f3c675;}
    .track-body{flex:1;min-width:0;}
    .track-body h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:#f3c675;margin-bottom:8px;}
    .track-body audio{width:100%;height:38px;outline:none;}
    .track-dl{flex-shrink:0;color:rgba(243,198,117,0.6);text-decoration:none;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}
    .track-dl:hover{color:#f3c675;}
    .foot{margin-top:24px;font-size:0.78rem;color:rgba(200,184,150,0.5);text-align:center;line-height:1.6;max-width:480px;}
    @media(max-width:480px){.track{flex-wrap:wrap;}.track-dl{width:100%;text-align:right;}}
  </style>
</head>
<body>
<div id="bg"></div>
<div class="page">

  <div class="topbar">
    <a href="index.html" class="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Back to Site</a>
    <span></span>
  </div>

  <div class="header">
    <div class="eyebrow">One Leg Up Music</div>
    <h1 class="gold-shimmer">Our Songs</h1>
    <p>The soundtrack of our nights. Press play and turn it up.</p>
  </div>

  <div class="track">
    <div class="track-num">1</div>
    <div class="track-body">
      <h2>One Leg Up</h2>
      <audio controls preload="metadata" src="music/One%20Leg%20Up.mp3"></audio>
    </div>
    <a class="track-dl" href="music/One%20Leg%20Up.mp3" download>Download</a>
  </div>

  <div class="track">
    <div class="track-num">2</div>
    <div class="track-body">
      <h2>Butterflies</h2>
      <audio controls preload="metadata" src="music/Butterflies.mp3"></audio>
    </div>
    <a class="track-dl" href="music/Butterflies.mp3" download>Download</a>
  </div>

  <div class="track">
    <div class="track-num">3</div>
    <div class="track-body">
      <h2>Ring My Bell</h2>
      <audio controls preload="metadata" src="music/RingMyBell.mp3"></audio>
    </div>
    <a class="track-dl" href="music/RingMyBell.mp3" download>Download</a>
  </div>

  <div class="track">
    <div class="track-num">4</div>
    <div class="track-body">
      <h2>First Time</h2>
      <audio controls preload="metadata" src="music/First%20Time.mp3"></audio>
    </div>
    <a class="track-dl" href="music/First%20Time.mp3" download>Download</a>
  </div>

  <p class="foot">Made for the club, played at our parties.</p>
</div>
<script>
  // Only one song plays at a time
  document.querySelectorAll('audio').forEach(function(player){
    player.addEventListener('play', function(){
      document.querySelectorAll('audio').forEach(function(other){
        if (other !== player) { other.pause(); }
      });
    });
  });
</script>
</body>
</html>
