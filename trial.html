<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Trial | One Leg Up</title>
  <link rel="icon" type="image/png" href="images/NewLogo/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{min-height:100vh;background:#080808;font-family:'Poppins',sans-serif;color:#fff;overflow-x:hidden;}
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(26,24,40,0.18),rgba(4,6,14,0.55) 60%,rgba(0,0,0,0.92) 100%),
      url('images/playboy-bg.png') center center / cover no-repeat;}
    #bg::after{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 50% 25%,rgba(255,186,118,0.07),transparent 50%);}
    .page{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px;}
    .back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;color:rgba(243,198,117,0.7);
      text-decoration:none;font-size:0.82rem;letter-spacing:0.08em;margin-bottom:28px;}
    .back:hover{color:#f3c675;}
    .header{text-align:center;margin-bottom:10px;}
    .header .eyebrow{font-size:0.72rem;letter-spacing:0.42em;text-transform:uppercase;color:rgba(255,220,150,0.5);margin-bottom:6px;}
    .header h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,8vw,3.4rem);font-weight:900;line-height:1;}
    .header h1 .gold{background:linear-gradient(90deg,#7a5700,#c8960c,#f3c675,#fffbe8,#ffd700,#fffbe8,#f3c675,#c8960c,#7a5700);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .header p{margin-top:12px;color:rgba(200,184,150,0.8);font-size:0.92rem;line-height:1.6;max-width:520px;}
    .card{width:100%;max-width:520px;background:rgba(10,25,35,0.75);border:1px solid rgba(243,198,117,0.2);
      border-radius:16px;padding:32px 28px;margin-top:26px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,0.5);}
    .field{margin-bottom:20px;}
    .field label{display:block;font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(243,198,117,0.7);margin-bottom:8px;}
    .field input[type=text],.field input[type=email],.field input[type=password]{
      width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(243,198,117,0.25);
      border-radius:8px;color:#fff;font-family:'Poppins',sans-serif;font-size:0.95rem;outline:none;}
    .field input:focus{border-color:rgba(243,198,117,0.6);}
    .radio-row{display:flex;gap:18px;flex-wrap:wrap;}
    .radio-row label{display:flex;align-items:center;gap:8px;font-size:0.9rem;color:#e8dcc0;cursor:pointer;
      text-transform:none;letter-spacing:0;margin-bottom:0;}
    .radio-row input{accent-color:#f3c675;width:16px;height:16px;}
    #trial-btn{width:100%;padding:14px;background:linear-gradient(135deg,#f3c675,#ec8b57);color:#0d1f28;font-weight:700;
      border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-size:1rem;cursor:pointer;margin-top:6px;}
    #trial-btn:disabled{opacity:0.6;cursor:wait;}
    #alert{display:none;margin-top:16px;padding:12px 16px;border-radius:8px;font-size:0.88rem;line-height:1.5;}
    #alert.err{display:block;background:rgba(180,30,30,0.18);border:1px solid rgba(220,60,60,0.5);color:#ffb4b4;}
    #alert.ok{display:block;background:rgba(30,120,60,0.18);border:1px solid rgba(60,180,100,0.5);color:#9df0b8;}
    .fine{margin-top:18px;font-size:0.78rem;color:rgba(200,184,150,0.55);line-height:1.6;text-align:center;}
  </style>
</head>
<body>
  <div id="bg"></div>
  <div class="page">
    <a class="back" href="index.html">&#8592; Back to home</a>
    <div class="header">
      <div class="eyebrow">One Leg Up</div>
      <h1><span class="gold">Free Trial</span></h1>
      <p>Got a trial code? You're in free until the end of the month. No card, just your email and a password.</p>
    </div>
    <div class="card">
      <form id="trial-form">
        <div class="field">
          <label for="code">Trial code *</label>
          <input type="text" id="code" placeholder="OLU-XXXXXX" autocomplete="off" autocapitalize="characters" required>
        </div>
        <div class="field">
          <label for="display_name">Display name *</label>
          <input type="text" id="display_name" placeholder="What should we call you?" required>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" placeholder="you@email.com" required>
        </div>
        <div class="field">
          <label>Couple or single *</label>
          <div class="radio-row">
            <label><input type="radio" name="profile_type" value="Couple" required> Couple</label>
            <label><input type="radio" name="profile_type" value="Single Male"> Single Male</label>
            <label><input type="radio" name="profile_type" value="Single Female"> Single Female</label>
          </div>
        </div>
        <div class="field">
          <label for="password">Password * <span style="text-transform:none;letter-spacing:0;color:rgba(200,184,150,0.5);">(min 8 characters)</span></label>
          <input type="password" id="password" minlength="8" required>
        </div>
        <button type="submit" id="trial-btn">Start My Free Trial</button>
        <div id="alert"></div>
        <p class="fine">Your trial runs free until the last day of this month. We'll email you before it ends so you can keep your membership going.</p>
      </form>
    </div>
  </div>
  <script>
    const API = 'https://api.onelegup.club';
    const alertEl = document.getElementById('alert');
    function showAlert(msg, kind) {
      alertEl.className = kind || 'err';
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
    }
    // prefill code from ?code= link
    const pre = new URLSearchParams(window.location.search).get('code');
    if (pre) document.getElementById('code').value = pre.toUpperCase();
    document.getElementById('trial-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      const btn = document.getElementById('trial-btn');
      btn.disabled = true; btn.textContent = 'Starting your trial...';
      const profileType = document.querySelector('input[name="profile_type"]:checked');
      try {
        const res = await fetch(`${API}/member/trial-signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: document.getElementById('code').value.trim(),
            display_name: document.getElementById('display_name').value.trim(),
            email: document.getElementById('email').value.trim(),
            profile_type: profileType ? profileType.value : '',
            password: document.getElementById('password').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showAlert(data.error || 'Could not start trial', 'err'); return; }
        localStorage.setItem('olu_token', data.token);
        const end = data.trial_expires_at
          ? new Date(data.trial_expires_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
          : 'the end of the month';
        showAlert(`You're in! Free trial active until ${end}. Taking you to your dashboard...`, 'ok');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
      } catch (err) {
        showAlert('Network error - please try again', 'err');
      } finally {
        btn.disabled = false; btn.textContent = 'Start My Free Trial';
      }
    });
  </script>
</body>
</html>
